<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Los Santos Ka - Mobil Oyun Portalı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Üst Başlık */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 18px 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Bakiye / Durum Çubuğu */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: var(--card-bg);
            margin: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #10b981;
        }

        /* Oyun Alanı */
        .game-container {
            flex: 1;
            padding: 0 12px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #334155;
            text-align: center;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* Örnek Mini Oyun: Şans Çarkı / Zar */
        .dice-display {
            font-size: 3rem;
            font-weight: 900;
            margin: 15px 0;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .result-msg {
            margin-top: 10px;
            font-size: 0.8rem;
            min-height: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>LOS SANTOS KA</h1>
        <p>FiveM Mobil Web Oyun Merkezi</p>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">Puan / Bakiye</span>
            <span class="stat-value" id="balance">$1,000</span>
        </div>
        <div class="stat-item" style="text-align: right;">
            <span class="stat-label">Durum</span>
            <span class="stat-value" style="color: #38bdf8;">Çevrimiçi</span>
        </div>
    </div>

    <div class="game-container">
        <!-- Örnek Mini Oyun Kartı -->
        <div class="card">
            <h2>Şanslı Sayı Çekilişi</h2>
            <p>50'nin üzerinde bir sayı tutturursan bahsini ikiye katla!</p>
            <div class="dice-display" id="numberDisplay">00</div>
            <button class="btn" onclick="playGame()">Şansını Dene ($100)</button>
            <div class="result-msg" id="resultMsg"></div>
        </div>
    </div>

    <script>
        let balance = 1000;

        function playGame() {
            const msgEl = document.getElementById('resultMsg');
            const numEl = document.getElementById('numberDisplay');
            const balEl = document.getElementById('balance');

            if (balance < 100) {
                msgEl.style.color = '#ef4444';
                msgEl.textContent = 'Yetersiz bakiye!';
                return;
            }

            balance -= 100;
            const randomNum = Math.floor(Math.random() * 100) + 1;
            numEl.textContent = randomNum < 10 ? '0' + randomNum : randomNum;

            if (randomNum > 50) {
                balance += 200;
                msgEl.style.color = '#10b981';
                msgEl.textContent = 'Kazandın! +$200 eklendi.';
            } else {
                msgEl.style.color = '#ef4444';
                msgEl.textContent = 'Kaybettin! Tekrar dene.';
            }

            balEl.textContent = '$' + balance.toLocaleString();
        }
    </script>
</body>
</html>
